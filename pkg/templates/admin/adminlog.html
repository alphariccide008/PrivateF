<body class="bg-[#031335]" >
    <!-- Navbar  -->
   <nav class="fixed top-0 left-0 w-full md:px-[13%] z-50 bg-[#021138] px-6 py-4 flex items-center justify-between shadow-md">
    
    <!-- Logo -->
    <div class="flex items-center">
      <img src="/static/img/logo.png" alt="Foundation Logo" class="md:h-10 h-9">
    </div>

     

  </nav>


  

 
<section class="bg-gray-100 px-3 flex items-center justify-center h-screen">
  <div class="bg-white p-8 rounded-xl shadow-md w-full max-w-md">
    <h2 class="text-2xl font-bold mb-6 text-gray-700 text-center">Welcome Admin</h2>

    {% include 'users/_messages.html' %}

    <form id="adminForm" method="post" action="{{ url_for('admin') }}" class="space-y-4">
      <input type="hidden" name="csrf_token" value="{{ csrf_token() }}">

      <!-- Email -->
      <div>
        <label for="email" class="block text-sm font-medium text-gray-600">Email</label>
        <input type="email" id="email" name="email" placeholder="Enter email"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-blue-200">
      </div>

      <!-- Password -->
      <div>
        <label for="password" class="block text-sm font-medium text-gray-600">Password</label>
        <input type="password" id="password" name="pwd" placeholder="Enter password"
          class="w-full p-3 border rounded-lg focus:outline-none focus:ring focus:ring-blue-200">
      </div>

      <!-- Submit Button -->
      <button type="submit"
        class="w-full bg-[#031335] text-white p-3 rounded-lg font-semibold hover:bg-blue-700 transition">
        Login
      </button>
    </form>
  </div>
</section>

<script>
  // Simple validation for empty fields
  document.getElementById("adminForm").addEventListener("submit", function (e) {
    let valid = true;
    this.querySelectorAll("input[type='email'], input[type='password']").forEach(input => {
      if (!input.value.trim()) {
        input.classList.add("border-red-500", "placeholder-red-400");
        input.placeholder = "This field is required";
        valid = false;
      } else {
        input.classList.remove("border-red-500", "placeholder-red-400");
      }
    });

    if (!valid) {
      e.preventDefault(); // stop form from submitting
    }
  });
</script>
